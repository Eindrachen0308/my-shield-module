name: DeepTech Daily News

on:
  schedule:
    # 毎日 09:00 JST = 00:00 UTC
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        working-directory: deeptech-tracker
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Fetch news
        working-directory: deeptech-tracker
        run: python scripts/fetch_news.py --days 2

      - name: Generate daily report
        working-directory: deeptech-tracker
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scripts/generate_report.py --mode daily

      - name: Commit & push
        run: |
          git config user.name "deeptech-tracker-bot"
          git config user.email "deeptech-tracker-bot@users.noreply.github.com"
          if [ -n "$(git status --porcelain deeptech-tracker/reports/daily)" ]; then
            git add deeptech-tracker/reports/daily
            git commit -m "chore(deeptech): daily news report $(date -u +%Y-%m-%d)"
            git push
          else
            echo "No new daily report to commit."
          fi
